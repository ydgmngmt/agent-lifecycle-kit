<rect class="n p" x="140" y="170" width="170" height="90" rx="6"/><text class="t" x="225" y="203" text-anchor="middle">Lead session</text><text class="s" x="225" y="219" text-anchor="middle">adlc-mode, autopilot root</text><text class="s" x="225" y="235" text-anchor="middle">Opus medium</text>
