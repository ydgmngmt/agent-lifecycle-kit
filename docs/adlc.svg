<rect class="n p" x="440" y="524" width="270" height="74" rx="6"/><text class="t" x="575" y="549" text-anchor="middle">Swarm verify</text><text class="s" x="575" y="565" text-anchor="middle">Sonnet: reruns gates and scripts</text><text class="s" x="575" y="581" text-anchor="middle">Opus: audits diff and receipts</text>
