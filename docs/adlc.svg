<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 925" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" color="#15232a" role="img" aria-label="ADLC 2.0 flow: plan with Pocock skills, build with pstack autopilot owners, PR exit by required checks and swarm verification, stage exit gate before main">
<style>
