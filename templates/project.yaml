# .agents/project.yaml: this repository's values for the agent-lifecycle-kit.
# The kit's skills and tools read it; nothing project-specific lives in the kit.
# Paths are relative to the repository root. Delete a key the project doesn't have.
# Where a value already lives in a repo file, write a pointer to it (`path#section — what to read there`),
# never a copy: the skills follow the pointer. Only values with no home in the repo are literal.

name: <project name>

docs:
  agents: AGENTS.md                       # operating model and invariants
  product: <product doc>                  # what is built and why
  stories: <user stories>
  journeys: <user journeys>
  glossary: GLOSSARY.md
  decisions: <ADR folder>/
  roadmap: docs/roadmap.md                # stages (the roadmap's phases), their stories, acceptance criteria, PRs
  acceptance: docs/acceptance/            # one acceptance-criteria file per stage: lc-criteria reads its ids
  lifecycle: docs/agents/lifecycle.md     # this project's way of working
  orchestration: docs/agents/orchestration.md
  testing: TESTING.md
  verification: .claude/skills/verify-<app>/   # the project's verification skill (pstack create-verification-skill): launch, drive, flow scripts, feature map
  formal: <the project's formal verification skill (pstack create-formal-verification-skill), or none>
  code_map: docs/agents/code-map.md       # which module owns which concept
  stack_decisions: docs/stack-decisions.md   # which tool owns which capability (templates/review/stack-decisions.md)
  stack_tools: docs/stack-tools.md        # each tool's functions and documentation lookups (templates/review/stack-tools.md)
  stack_exceptions: docs/stack-exceptions.md # the deviations the owner allowed (templates/review/stack-exceptions.md)
  gate_runbook: <gate runbook>
  domain_set:                             # "update the docs", set 1 (update-docs)
    - GLOSSARY.md
    - <ADR folder>/
    - <PRD and stories>
    - <user journeys>
    - <product principles>
    - <issue tracker, triage labels and domain-docs setup docs>
    - <issue tracker: GitHub Issues, or where issues live>
  lifecycle_set:                          # "update the docs", set 2
    - docs/agents/lifecycle.md
    - .agents/project.yaml
    - docs/roadmap.md
    - <stage acceptance files>
    - docs/agents/orchestration.md
    - docs/agents/code-map.md
    - TESTING.md
    - <gate runbook>
    - AGENTS.md
    - CLAUDE.md

update_docs:
  log: docs/agents/docs-updates.md        # one line per "update the docs" run; the next run starts at the last

profiles:                                 # one entry point per moment; CI calls pr and nightly
  commit: <cmd> verify:commit             # before each push: typecheck + specs covering changed files
  pr: <cmd> verify:pr                     # what PR CI runs: build, typecheck, tests, and the flow scripts covering the diff
  acceptance: <cmd> verify:acceptance     # the stage exit: lc-criteria <the stage's acceptance file> <flow script folder>, then every flow script
  stage: <cmd> verify:stage               # the stage exit's regression run, in order
  nightly: <cmd> verify:nightly           # full suite on main

ci:
  enforcement: <host settings that enforce the gates, or none (by convention only)>
  required_checks: verify-pr pr-body      # CI job names every pull request needs green: lc-gate protect sets them on the default branch and, with --branch, on each stage branch; gate_pr's checks step reads them
  # no CI host: only `enforcement: none` here, no checks step, and gate_pr's command steps run the checks
  # verify-pr: templates/ci/pr.yml (the pr profile and the rules); pr-body: templates/ci/pr-body.yml; a project with a formal model adds formal: templates/ci/formal.yml

pr_body:                                  # the record a PR body carries, checked by CI's pr-body job
  heading: Tool fit                       # the body's section: ## Tool fit
  if: mechanism                           # only when the diff touches paths.mechanism
  shapes: docs/review/tool-fit.md#accepted-lines   # the fenced block of accepted lines under that heading

stage:
  branch: stage/<id>                      # each stage's branch, cut from the default branch; its PRs land here, and its own PR into the default branch is the stage exit
  plans: <handoff_dir>/plans/             # one plan file per stage (pstack multi-phase-plan): each PR section is its PR owner's scope

# The stage exit's steps (lc-gate): the gate on the stage branch's pull request into the default
# branch. A pull request into a stage branch has no steps here: the host's required checks and its
# swarm verdict (the adlc-mode skill, Autopilot-full) land it. One line per step, in the order they run:
#   <step>: <kind> <argument> [if <paths key>] [plan] [after <step>[,<step>]]
# kind: command (the runner runs it) · workflow (a CI workflow file, dispatched with -f candidate=<sha>)
#       · checks (no argument: the host's ci.required_checks on the exact commit) · session (a spawned
#       review session; the argument is its question file) · here (done by the session running the
#       gate; the argument says what) · owner (a board question).
# `if <key>` runs the step only when the change touches a glob under paths.<key>.
# `after <step>` starts the step once each named step above holds with PASS or N/A: the checks that
# cost no model tokens come before the review sessions.
# Keep " #" and " — " out of a step line: the reader cuts a value there. An argument may not end in
# `plan`, `if <word>` or `after <word>` (read as the flags): quote it, e.g. bash -c 'terraform plan'.
# Modes: off | observe (log and tell) | observe <n> | enforce (refuse). `observe <n>` observes until n
# PRs have merged with every record, then enforces by itself; the hook says so once.
# lc-gate enforcement shows where a count stands.
gate_pr_only: default-branch              # the merge hook checks only a pull request into the default branch
gate_pr_mode: enforce                     # the stage exit's records, at lc-gate merge, gh pr merge or git merge into the default branch
gate_pr_plan: off                         # no step here ends in `plan`

paths:                                    # globs separated by spaces; ** spans directories
  code: <globs of everything but prose, e.g. apps/** packages/** tools/** e2e/** **/package.json .github/** .agents/**>
  sensitive: <globs of the sensitive code paths: a brief touching them is proposed as rigor: critical>
  mechanism: <globs where a new mechanism can land, e.g. apps/** packages/** tools/** **/package.json>
  formal: <globs of the formal model and the code it maps to, or delete the key>

# No step here is the author's own word: each record comes from the runner, the host or a separate
# session (lc-gate enforcement flags a `here` step in gate_pr). `if code` makes a docs-only pull
# request (the docs sweep) N/A for every step but the host's checks and the rules.
gate_pr:
  ci: checks                              # ci.required_checks on the pushed head; no CI host: drop it and each "ci" below
  rules: command lc-rules check --base $LC_GATE_BASE   # .agents/rules.yaml, judged by the base's copy; no CI host needed
  regression: workflow <stage workflow file> if code       # the full regression run on the stage's head
  integration: workflow <integration workflow file> if code   # delete the line where the stage run already holds the integration suite
  acceptance: command <cmd> verify:acceptance if code after ci   # every criterion has a flow script (lc-criteria), and every flow script passes
  thermo-review: session docs/review/thermo-review.md if code after ci,acceptance    # bugs, breakage, security, developer setup, feature leaks
  thermo-quality: session docs/review/thermo-quality.md if code after ci,acceptance  # structure and maintainability, by the Thermos bar
  stack: session docs/review/stack-hunt.md if mechanism after ci,acceptance          # a chosen tool rebuilt under another name

merge:
  command: lc-gate merge pr <stage branch>   # updates a behind branch, waits for the checks on the new head, requires every record
  who: lead

# The files that define the rules change only in a PR the owner reads. Globs; or a pointer `file#key`
# to a list kept elsewhere. lc-gate enforcement names each rule file missing from it.
owner_approval: [.agents/project.yaml, .agents/ci/**, .githooks/**, .github/workflows/**, docs/review/**, docs/stack-decisions.md, docs/stack-tools.md, docs/stack-exceptions.md]
protected_files: [.agents/project.yaml, .agents/rules.yaml, .agents/rules-baseline.json, .agents/ci/**, .githooks/**, .github/workflows/**, docs/review/**, docs/stack-decisions.md, docs/stack-tools.md, docs/stack-exceptions.md]
pinned_files: []                          # change only when a plan schedules it

lanes:
  list: []                                # stack lanes for sessions; one per checkout
  ci: <lane reserved for CI, if any>
  up: <command to bring a stack up on a lane>

browser: <the browser test tool the flow scripts use, or none (no UI)>
machine: <limits on heavy commands, if any>

handoff_dir: <directory for plans/, kickoffs/, reports/, trails/, logs/, owner-reads/>

board:                                    # lc-board: the owner's page (kit board/)
  port: 4777
  data_dir: <dir for state.json, questions.json, answers.jsonl; default handoff_dir/board>
  running_log: <the stage's running log; the keeper reads its new lines with lc-board log>
  keeper_model: <a cheap model for the board keeper>
  keeper_effort: low
  # keeper_flags: <extra agent flags; default: no MCP servers, no settings, only the kit's skills>

sessions:                                 # read by lc-spawn, lc-close, lc-view
  tmux_session: <name>
  agent_cmd: claude                       # pstack has no Codex adapter: owner sessions and the lead run in Claude Code
  model: opus                             # owner sessions; pstack's own roles are in ~/.claude/rules/pstack-models.md (docs/machine.md)
  effort: medium
  gate_model: opus                        # the stage exit's review sessions; never the lead's LC_MODEL
  gate_effort: medium
  # gate_parallel: <n>                    # how many gate sessions lc-gate run starts at a time; unset: all at once
  # gate_setup: <cmd, e.g. pnpm install>  # run once in one worktree per gate candidate, where its sessions read; unset: each makes its own
  # gate_rounds: 2                        # follow-up reviews of a step that may end in FAIL before only the lead starts another
  # gate_flags: <agent flags for gate sessions in place of agent_flags; {kit} is the kit's directory (docs/machine.md)>
  # memory_floor_mb: <n>                  # lc-spawn starts no session while less memory is available
  lead: <the lead's tmux window name; lc-tell lead and the board's answers reach it>
  agent_flags: <how sessions get permissions unattended, e.g. --permission-mode auto>   # "": each stops at its first prompt
  owner_read: <command that opens a diff or doc for the owner>
  open_tab: <command that opens a terminal tab on a new session, given its name as $1, and leaves the focus where the owner is (docs/machine.md)>   # unset: no tab, the owner sees no session
