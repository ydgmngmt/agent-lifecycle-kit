# .agents/project.yaml: this repository's values for the agent-lifecycle-kit.
# The kit's skills and tools read it; nothing project-specific lives in the kit.
# Paths are relative to the repository root. Delete a key the project doesn't have.
# Where a value already lives in a repo file, write a pointer to it (`path#section — what to read there`),
# never a copy: the skills follow the pointer. Only values with no home in the repo are literal.

name: <project name>

docs:
  agents: AGENTS.md                       # operating model and invariants
  product: <product doc>                  # what is built and why
  stories: <user stories>
  journeys: <user journeys>
  glossary: GLOSSARY.md
  decisions: <ADR folder>/
  roadmap: docs/roadmap.md                # phases, their stories, acceptance criteria, PRs
  acceptance: docs/acceptance/            # one acceptance-criteria file per phase, if not inline in the roadmap
  lifecycle: docs/agents/lifecycle.md     # this project's way of working
  orchestration: docs/agents/orchestration.md
  phase_review: docs/agents/phase-review.md   # the phase exit's values (templates/phase-review.md)
  phase_records: docs/phase-reviews/      # lc-gate status phase <id> --write writes <id>.md here
  testing: TESTING.md
  review_checklist: docs/review-checklist.md
  code_map: docs/agents/code-map.md       # which module owns which concept
  gate_runbook: <gate runbook>
  domain_set:                             # "update the docs", set 1 (update-docs)
    - GLOSSARY.md
    - <ADR folder>/
    - <PRD and stories>
    - <user journeys>
    - <product principles>
    - <issue tracker, triage labels and domain-docs setup docs>
    - <issue tracker: GitHub Issues, or where issues live>
  lifecycle_set:                          # "update the docs", set 2
    - docs/agents/lifecycle.md
    - .agents/project.yaml
    - docs/roadmap.md
    - <phase acceptance files>
    - docs/agents/phase-review.md
    - <phase records>
    - docs/agents/orchestration.md
    - docs/agents/code-map.md
    - docs/review-checklist.md
    - TESTING.md
    - <gate runbook>
    - AGENTS.md
    - CLAUDE.md

update_docs:
  log: docs/agents/docs-updates.md        # one line per "update the docs" run; the next run starts at the last

profiles:                                 # one entry point per moment; CI calls pr and nightly
  commit: <cmd> verify:commit             # before each push: typecheck + specs covering changed files
  pr: <cmd> verify:pr                     # what PR CI runs
  phase: <cmd> verify:phase               # the phase run, in order
  nightly: <cmd> verify:nightly           # full suite on main

checks:
  duplicates: <cmd>                       # supports --list and --prune
  dead_code: <cmd>
  supply_chain: <tool and where it runs>

ci:
  pr_checks: [<required check names>]     # an empty list is never success
  phase_workflow: <workflow file of the phase run, if CI has one>   # templates/ci/phase.yml
  enforcement: <host settings that enforce the gates, or none (by convention only)>

gate:
  run: <gate command, intent from a file>

# The gates' steps (lc-gate). One line per step, in the order they run:
#   <step>: <kind> <argument> [if <paths key>]
# kind: command (the runner runs it) · workflow (a CI workflow file, dispatched with -f candidate=<sha>)
#       · session (a spawned review session; the argument is its question file) · here (done by the
#       session running the gate; the argument says what) · owner (a board question).
# `if <key>` runs the step only when the change touches a glob under paths.<key>.
# Keep " #" and " — " out of a step line: the reader cuts a value there.
gate_pr_mode: observe                     # off | observe (warn) | enforce (refuse)

paths:                                    # globs separated by spaces; ** spans directories
  flow: <globs of code a person or agent uses, e.g. apps/web/** packages/api/**>
  sensitive: <globs of the sensitive code paths>

gate_pr:
  commit-check: command <cmd> verify:commit
  self-review: here code-review against the base, the brief as the spec
  live-check: here the project's verify skill on the changed flow if flow
  reviewer: session docs/review-checklist.md if sensitive
  # stack-fit: here docs/review/stack-fit.md if flow plan   # `plan`: a plan recorded before the first commit (lc-gate record … plan)

gate_phase:
  freeze: command <script that writes the evidence folder: PR list, files, surface diff, baseline growth, quality lists>
  regression: workflow <phase workflow file>
  integration: workflow <integration workflow file>
  built: session <review question files dir>/built-as-described.md
  correctness: session <review question files dir>/correctness.md
  security: session <review question files dir>/security.md
  architecture: session <review question files dir>/architecture.md
  duplication: session <review question files dir>/duplication.md
  dead-code: session <review question files dir>/dead-code.md
  docs: session <review question files dir>/docs.md
  findings: here one list, every finding with a disposition
  fix-retest: here blocking findings fixed, affected steps rerun or carried
  acceptance: owner
  lessons: here proposed checklist rules, stale rules pruned

merge:
  command: <merge command with the validated head SHA>
  candidate: <merge queue | update the branch from main, then wait for the required checks on the new head>
  who: orchestrator

owner_approval: []                        # protected files: the human owner approves each change before merge; own PR
protected_files: []                       # files only an owner decision may change (usually the same list)
pinned_files: []                          # change only when a brief schedules it
sensitive: <sensitive code paths, approved by an independent reviewer session (where they are listed, or the list)>

lanes:
  list: []                                # stack lanes for sessions; one per checkout
  ci: <lane reserved for CI, if any>
  up: <command to bring a stack up on a lane>

browser: <browser tooling for live checks>
machine: <limits on heavy commands, if any>

handoff_dir: <directory for briefs/, reports/, intents/, logs/, owner-reads/>

board:                                    # lc-board: the owner's page (kit board/)
  port: 4777
  data_dir: <dir for state.json, questions.json, answers.jsonl; default handoff_dir/board>
  running_log: <the phase's running log; the keeper reads its new lines with lc-board log>
  keeper_model: <a cheap model for the board keeper>
  keeper_effort: low
  # keeper_flags: <extra agent flags; default: no MCP servers, no settings, only the kit's skills>

sessions:                                 # read by lc-spawn, lc-close, lc-view
  tmux_session: <name>
  agent_cmd: claude                       # claude or codex
  model: <model>
  effort: <effort>
  agent_flags: ""
  max_subagents: <n>                      # how many subagents one session runs at a time
  owner_read: <command that opens a diff or doc for the owner>
  # open_tab: <command that opens a terminal tab on a new session, given its name as $1; unset: none, so spawning never takes focus>
