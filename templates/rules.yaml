# .agents/rules.yaml: the project's mechanical rules, run by lc-rules (rules/rules.mjs in the kit).
# A rule enforces a decision the project has written down, decides exactly, and is shown failing its red
# example and passing its green one: `lc-rules selftest`. Existing findings go in
# .agents/rules-baseline.json once (`lc-rules baseline`), which then only shrinks (`--prune`).
# CI runs `lc-rules check --base <base>`: the base commit's copy of this file and the baseline judge.
# Both files are protected_files. Kinds: import, dependency, text, path (see rules/rules.mjs).
#
# Three starter rules: uncomment one, point it at your decision and your paths, run selftest.
