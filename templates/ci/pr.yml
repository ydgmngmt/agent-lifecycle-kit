# PR profile: CI runs exactly what `verify:pr` runs locally, on every pull request: into a stage
# branch and into the default branch. `verify-pr` is a required check on both (lc-gate protect).
name: PR checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-pr:
    runs-on: <runner labels>
    timeout-minutes: <minutes>
    steps:
      - uses: actions/checkout@<pinned sha>
        with:
          persist-credentials: false
          fetch-depth: 0
      # <toolchain setup>
      - name: verify:pr
        run: <cmd> verify:pr
      # The kit, pinned, for the mechanical rules.
      - uses: actions/checkout@<pinned sha>
        with:
          repository: <owner>/agent-lifecycle-kit
          ref: <pinned kit commit>
          path: .lc-kit
          persist-credentials: false
      # The mechanical rules (.agents/rules.yaml): each proved red and green, then judged by the base
      # commit's rules and baseline (lc-rules says loudly when this change edits them). It runs even
      # without the file, so a change that deletes it is still judged by the base's rules.
      - name: Mechanical rules
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .lc-kit/bin/lc-rules selftest && .lc-kit/bin/lc-rules check --base "$BASE"
