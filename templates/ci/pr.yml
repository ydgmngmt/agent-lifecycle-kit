# PR profile: CI runs exactly what `verify:pr` runs locally.
name: PR checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-pr:
    runs-on: <runner labels>
    timeout-minutes: <minutes>
    steps:
      - uses: actions/checkout@<pinned sha>
        with:
          persist-credentials: false
          fetch-depth: 0
      # <toolchain setup>
      - name: verify:pr
        run: <cmd> verify:pr
      # A phase marked done needs its phase record with every gate_phase step held (lc-gate).
      - uses: actions/checkout@<pinned sha>
        with:
          repository: <owner>/agent-lifecycle-kit
          ref: <pinned kit commit>
          path: .lc-kit
          persist-credentials: false
      - name: Phase record
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .lc-kit/bin/lc-gate check phase --diff "$BASE" "$HEAD"
