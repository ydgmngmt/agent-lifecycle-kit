# Formal check: the project's model checker or prover, when a pull request touches a model, a
# proof or the code they map to (paths.formal). The job always reports, so it can be a required check: a pull request
# that touches neither passes without running the checker.
name: Formal check
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  formal:
    runs-on: <runner labels>
    timeout-minutes: <minutes>
    steps:
      - uses: actions/checkout@<pinned sha>
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does the change touch the model or its code?
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD -- <the globs of paths.formal, as git pathspecs> | grep -q .; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "no formal path touched: nothing to check"; fi
      # <Java 17 for TLC; elan and lake for Lean; or the checker's own toolchain>
      - name: Model check
        if: steps.touched.outputs.run == 'yes'
        run: <the formal verification skill's one command; it exits non-zero when a property breaks, and a timeout is a failure>
