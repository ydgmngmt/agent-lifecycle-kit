# Phase profile: the phase run on the frozen candidate, started by hand.
# The profile writes its per-step logs and traces under $PHASE_OUT, and $PHASE_OUT/evidence.md:
# one row per acceptance criterion with PASS, FAIL or NOT TESTED, the trace path and the SHA.
# A step that needs a person or a live model is a row marked MANUAL with what is needed, never skipped silently.
name: Phase run
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the frozen candidate
        required: true
      phase:
        description: Phase id
        required: true
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify-phase:
    runs-on: <runner labels>
    timeout-minutes: <minutes>
    env:
      PHASE_OUT: ${{ github.workspace }}/.phase-run
    steps:
      - uses: actions/checkout@<pinned sha>
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - name: Candidate is the checked-out commit
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE"
      # <toolchain setup>
      - name: verify:phase
        run: <cmd> verify:phase
      - name: Evidence as the run summary
        if: always()
        env:
          PHASE: ${{ inputs.phase }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          { echo "## Phase $PHASE at $CANDIDATE"; cat "$PHASE_OUT/evidence.md" 2>/dev/null || echo "No evidence.md: the run stopped before writing it."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@<pinned sha>
        if: always()
        with:
          name: phase-${{ inputs.phase }}-${{ inputs.candidate }}
          path: .phase-run/
