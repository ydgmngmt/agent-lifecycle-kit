# Nightly profile: the full suite on main. A failure opens or updates one issue.
name: Nightly
on:
  schedule:
    - cron: '<off-the-hour minute> <hour> * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify-nightly:
    runs-on: <runner labels>
    timeout-minutes: <minutes>
    steps:
      - uses: actions/checkout@<pinned sha>
        with:
          persist-credentials: false
      # <toolchain setup>
      - name: verify:nightly
        run: <cmd> verify:nightly
  report-failure:
    needs: verify-nightly
    if: failure()
    runs-on: <runner labels>
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly failed'
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [[ -n $issue ]]; then gh issue comment "$issue" --body "$RUN_URL"; else gh issue create --title "$title" --body "$RUN_URL"; fi
